# Presupuestos de peso. Fuente de verdad para `sourc size`.
#
#   gzip = bytes transferidos, medidos con la biblioteca estándar
#   raw  = bytes en disco
#
# Tolerancia: 2%. El build falla con codigo 1 al superarse.
#
# ## Por que `gzip` y no `brotli`
#
# Porque el gate **no puede depender de la máquina**. Con `brotli` como techo,
# un `make size` en una máquina sin ese binario fallaba: "no se pudo comprimir"
# contaba como incumplimiento. Un gate que necesita una herramienta que no esta
# en el repo no protege el repo, se desactiva el dia que estorba.
#
# `gzip` está en la biblioteca estándar, siempre está, y mide casi lo mismo:
# brotli es el 90% de gzip en JavaScript y el 83% en HTML. `raw` es exactamente
# lo que el navegador descarga si el servidor no comprime, y hace de suelo.
#
# `brotli` sigue apareciendo en el informe, como columna informativa, cuando el
# binario esta. No es un techo: si lo fuera, volveriamos a depender de el.
#
# ## Las entradas de fases futuras
#
# `source_2d.wasm`, `glue_2d.js`, `styles.css`, `glue_web.js`, `source_3d.wasm`,
# `glue_3d.js` y `sourc.wasm` no existen todavia. Su `gzip` es una **proyeccion**
# del antiguo numero en brotli, escalada con la razon medida de cada formato, y
# hay que rebasarla cuando el artefacto exista. Se dice con `note` en cada una,
# porque un techo puesto a ojo y luego exigido por el gate es una contradiccion:
# la regla del fichero es que lo que no se puede medir no se da por bueno.
#
# ## Los artefactos módulos del glue
#
# glue_2d, glue_3d y glue_web NO se descargan salvo que el programa use sus
# primitivas, y su ausencia en un hola mundo es precisamente lo que sostiene
# estos numeros. Por eso el techo del pegamento es el que aprieta y el de los
# módulos no.

schema = 1
tolerance = 0.02

# ---------------------------------------------------------------- Fase 2
#
# La tabla de la Fase 2 en ROADMAP-FASES.md tiene dos columnas: 0.8/2.5/1 KB de
# objetivo y 1/3/1.5 KB de techo. Los objetivos cuentan el módulo ya
# optimizado con binaryen, que es el paso `--release` y que aun no se puede
# ejecutar aquí. Mientras tanto el gate mide el módulo sin optimizar, y por eso
# los tres objetivos están subidos: dejarlos donde los puso el roadmap haría
# que `make size` fallara siempre, y un gate que falla siempre no es un gate.
#
# La segunda columna si esta entera, como `hard_gzip`, y esos numeros no se tocan
# en ninguna fase. Son los que atrapan una regresión grande.

[[budget]]
name = "hola-mundo-wasm"
phase = 2
target = "wasm"
mode = "page"
example = "hola.src"
# Medido: 4426 B gzip / 9889 B en disco. La holgura es de 3.1x, la misma que
# tenia en brotli. Es un techo holgado a propósito: la página crecerá en las
# fases 3 y 5 con el glue que el programa use, y este numero tiene que aguantar
# eso sin dejar de ser un techo.
gzip = 13800
raw = 27648

# No hay presupuesto para source_core.wasm en la Fase 2: el primer módulo de
# runtime escrito en Source llega con ARENA en la Fase 4. Ver ARCHITECTURE.md 6.1.

[[budget]]
artifact = "main.wasm"
phase = 2
# Objetivo del roadmap: 820, que lo aporta `--release` con binaryen. Hoy se mide
# el módulo sin optimizar: el peor caso es laberinto con 1197 B gzip.
gzip = 1320
hard_gzip = 1580
raw = 3072

[[budget]]
artifact = "main.wasm de 15_operaciones.src"
phase = 2
# Este programa existe para ejercitar operaciones que los demás no tocan --el
# censo del tripwire-- así que pesa bastante mas que `hola-mundo` y no es
# comparable con el techo de arriba: el mismo presupuesto para los dos obligaría
# a recortar cobertura para cumplir un numero. Lo que si interesa es que a
# partir de aquí cualquier regresión se note.
#
# Los 450 B de mas sobre hola-mundo son `@__printArray` y `@__printElem`, que se
# declaran sólo si el programa imprime un array.
#
# Subió de 2100 a 2260 al añadir el bloque de igualdad de flotantes (`eq.f32` y
# `eq.f64`). Subir el techo es lo correcto aquí y recortarlo no: el número
# existe para que una regresión se note, no para impedir demostrar que una
# operación funciona. Recortar la cobertura para cumplir un número invierte las
# dos cosas.
#
# Dos bloques **no** entraron aquí sino en programas con nombre propio:
# `16_nativas.src` (ABS/MIN/MAX/CLAMP) y `17_truncamiento.src` (las dos
# truncaciones de la división entera).
#
# Y no es casualidad: el techo de este programa hubo que subirlo **tres veces**
# en un día, una por bloque nuevo, y un techo que hay que subir cada vez que se
# añade cobertura ha dejado de notar regresiones -- que es lo único que hace.
# Un archivo por bloque mantiene cada techo donde tiene sentido, y hace que el
# diff diga qué cambió sin tener que leer el programa entero dos veces.
gzip = 2260
hard_gzip = 2560
raw = 4700

[[budget]]
artifact = "main.wasm de 17_truncamiento.src"
phase = 2
# Programa pequeño y con un techo propio por lo mismo que `16_nativas.src`. El
# margen es corto a propósito: aquí no hay nada que descubrir, sólo una
# diferencia de un byte entre dos truncaciones que ya no se pueden volver a
# confundir.
gzip = 640
hard_gzip = 780
raw = 1400

[[budget]]
artifact = "index.html de pagina.src"
phase = 2
# La página del proyecto. El techo está en el mismo fichero que el resto porque
# el peso es una cosa del proyecto, no de la herramienta que lo mide.
#
# Y el número está donde está por la razón contraria que `source_glue.js`: aquí
# **todo** el peso lo paga el visitante, y no hay forma de que el presupuesto se
# esquive por un camino que no mire. Una página que crece y nadie se entera es el
# peor sitio posible para un presupuesto: es el único artefacto que la gente
# descarga sin haberpedido nada a cambio.
#
# El techo sale de la **primera medición**, no de un número inventado: son 4415 B
# gzip y 10850 B en crudo. Se pone un 4% por encima para que un retoque de prosa
# no rompa el build, y nada más: si esta página crece un 40% es porque alguien
# ha metido algo que no era una frase.
#
# Los comentarios de `site/styles.css` **no** se envían: se quitan al embeber
# (`tools/build_site.py`), y eso ya.valió 751 B gzip. Se quedan en el fuente, que
# es donde explican por qué; en el artefacto serían bytes que el visitante paga
# por nada, que es justo lo que la regla de `source_glue.js` dice.
gzip = 4600
hard_gzip = 5100
raw = 11200

[[budget]]
artifact = "source_glue.js"
phase = 2
# **Este es el techo que aprieta.** El pegamento es lo que descarga todo el
# mundo: hoy son 2851 B gzip contra los 122 B del programa de hola mundo, o sea
# 23 veces el programa. Cualquier byte que se meta aquí lo paga el 100% de las
# páginas, y por eso el objetivo va sin margen: 2%.
#
# Subió de 2824 a 2851 por `pow`, que es el operador `^` y va al host porque el
# MVP de WASM no lo tiene como instrucción: son 27 B que no hay dónde mover al
# módulo, porque no cabe. Y los 24 B que subió su comentario de dos líneas se
# volvieron a quitar dejándolo en una, porque un techo sin margen no admite
# comentarios que el usuario final paga.
#
# Bajó de 2816 a 2600 al mover el formateo de arrays al módulo: `PRINT` de un
# array lo baja `@__printArray`, dentro del WASM, y no el pegamento. Son unos
# 450 B que antes pagaba toda página y solo unos pocos programas usan. Esa es la
# regla que sale de ahi: **mecanismo en el pegamento, semántica en el módulo**.
gzip = 2880
hard_gzip = 3400
raw = 7168

[[budget]]
artifact = "index.html"
phase = 2
# Objetivo del roadmap: 1024. Hoy son 1480: una página de 2.8 KB con el estilo
